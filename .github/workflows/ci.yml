name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Builds the React frontend too (frontend-maven-plugin downloads its own Node).
      - name: Build and test
        run: mvn -B clean verify

  e2e:
    name: End-to-end (Playwright against a live stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start app + database
        run: docker compose up -d --build monohull-app
      - name: Run e2e suite
        run: docker compose --profile test run --build --rm e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose --profile test down -v
