# Throwaway Monohull instance for the post-merge Maximo regression run.
#
# Always run with a per-run project name so nothing collides between runs or
# with the production instances on the same host:
#
#   docker compose -p monohull-ci-<run-id> -f ci/docker-compose.ci.yml up -d --build
#
# Isolation vs production Monohull instances on the same Docker daemon:
#   - its own dynamic port range (13000-13099; production uses 12000-12999)
#   - its own subnet pool (10.200.0.0/16; production uses 10.100.0.0/16)
#   - MONOHULL_MAXIMO_DOMAIN deliberately unset: never joins the shared
#     made-public/Traefik network, never claims a public route
#   - environments are seeded with client "ci" + a per-run project, so the
#     generated env/container/network/volume names can never match production's
#   - hostVolumePath in the CI bundle points at a CI-only root
#
# Credentials are per-run throwaways generated by the workflow - nothing here
# has a default that could be left running by accident.

services:
  monohull-ci-db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: ${CI_ADMIN_PASSWORD:?generate a per-run password}
      MYSQL_DATABASE: made
      MYSQL_USER: made
      MYSQL_PASSWORD: ${CI_ADMIN_PASSWORD:?generate a per-run password}
    # No named volume on purpose: the anonymous volume dies with `down -v`.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  monohull-ci-app:
    build:
      context: ..
    ports:
      - "${CI_MONOHULL_PORT:-8899}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://monohull-ci-db:3306/made
      SPRING_DATASOURCE_USERNAME: made
      SPRING_DATASOURCE_PASSWORD: ${CI_ADMIN_PASSWORD}
      MONOHULL_ADMIN_USERNAME: ci-admin
      MONOHULL_ADMIN_PASSWORD: ${CI_ADMIN_PASSWORD}
      MONOHULL_API_KEY: ${CI_API_KEY:?generate a per-run API key}
      MONOHULL_PORTS_RANGE_START: "13000"
      MONOHULL_PORTS_RANGE_END: "13099"
      MONOHULL_NETWORK_SUBNET_POOL: 10.200.0.0/16
      APP_DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      monohull-ci-db:
        condition: service_healthy
