# Vanilla-Maximo profile for the post-merge regression run.
#
# This is a template: ${CI_*} placeholders are filled by envsubst in ci/seed.sh.
# The private values (registry, image refs) live in the runner host's env file,
# never in this public repo.
#
# client/project drive every generated name (environment, containers, network,
# DB volume, host subdir) - the per-run project is what guarantees a CI env can
# never collide with a production environment on the same Docker daemon.
kind: madeImageConfigBundle
schemaVersion: 2
imageConfig:
  client: ci
  project: ${CI_RUN_PROJECT}
  maximoVersion: MAS
  appImage: ${CI_VANILLA_APP_IMAGE}
  dbImage: ${CI_VANILLA_DB_IMAGE}
  admImage: ${CI_VANILLA_ADM_IMAGE}
  dbVendor: DB2
  dbName: maximo
  dbContainerPort: 25000
  dbCommand: restore
  dbVolumeTarget: /home/db2inst1
  hostVolumePath: ${CI_HOST_VOLUME_ROOT}
  dbExtraEnv:
    - key: MAXIMO_DB_PASSWORD
      value: maximo
  dbExtraBinds:
    # The vanilla DB image's `restore` command pulls its backup via the AWS CLI.
    - hostPath: ${CI_AWS_DIR}
      containerPath: /home/db2inst1/.aws
      readOnly: true
  admExtraEnv:
    - key: MAXLOAD_USER
      value: mxintadm
pipeline:
  # All steps are built-in actions, present in any fresh Monohull instance, in the
  # same order as their autoRun/afterAction chain in application.yml. Two ordering
  # rules matter: swap-web-xml-to-dev must precede build-ear (the dev descriptors
  # compile into the EAR; without them Liberty answers /maximo/ui/* and /oslc/*
  # with an unsatisfiable BASIC 401), and swap-server-xml-to-dev must precede
  # start-app (APP has to boot on the dev server.xml, not hot-swap under it).
  name: ci-vanilla
  description: Vanilla MAS build for the post-merge regression run
  steps:
    - actionKey: run-updatedb-preprocessor
      sequenceOrder: 0
    - actionKey: swap-web-xml-to-dev
      sequenceOrder: 1
    - actionKey: build-ear
      sequenceOrder: 2
    - actionKey: mas-fix-pre-updatedb
      sequenceOrder: 3
    - actionKey: run-updatedb
      sequenceOrder: 4
    - actionKey: mas-fix-post-updatedb
      sequenceOrder: 5
    - actionKey: set-maxadmin-password
      sequenceOrder: 6
    - actionKey: swap-server-xml-to-dev
      sequenceOrder: 7
    - actionKey: start-app
      sequenceOrder: 8
    - actionKey: restart-was
      sequenceOrder: 9
launch:
  description: CI vanilla MAS regression
  # Dynamic ports from the CI instance's own 13000-13099 range.
  staticPorts: false
  includeMock: false
  includeSmtp: false
