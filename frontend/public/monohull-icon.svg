<!--
  Monohull app icon: the heeling-sailboat mark on the brand gradient tile.

  The mark geometry is the supplied brand pack verbatim (docs/brand/sailboat-mark-white.svg),
  drawn on a 200x200 artboard, so it is scaled by 2.56 to fill the 512 icon. Keep this file
  and favicon.svg in step — they are the only places the artwork is duplicated, and every
  PNG derivative is generated from this one (see frontend/pwa-assets.config.ts).

  The tile is not part of the supplied pack. It is kept because the pack is transparent, and
  transparent icons read badly against browser tabs, OS launchers, and the maskable safe area.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g transform="scale(2.56)">
    <g transform="translate(-7 -4) rotate(18 100 162)">
      <path d="M104 30 C111 66 118 100 128 132 L104 130 Z" fill="#ffffff" fill-opacity=".66"/>
      <path d="M97 50 C88 84 81 110 72 138 L97 130 Z" fill="#ffffff" fill-opacity=".34"/>
      <rect x="99" y="30" width="4" height="106" fill="#ffffff"/>
      <path d="M62 138 C74 129 126 129 138 138 C128 158 115 169 100 172 C85 169 72 158 62 138 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>
